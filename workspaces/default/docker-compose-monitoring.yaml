# Monitoring — how the company sees itself, and the only evidence the agent gets.
#
# Named for the role, like the rest (`tracking` is Matomo, `erp` is a file drop).
#
# ── Company systems only ────────────────────────────────────────────────────
#
# Nothing here observes the SIMULATOR, the portal, or the simulator's database.
# The simulator is not part of TimberWorks — it is the instrument that produces
# the symptom, and it knows each synthetic customer's intent. Feeding that to an
# agent investigating the incident is handing over the answer key, so the boundary
# is enforced by never collecting it: an explicit allowlist for logs, and for
# metrics only named targets are scraped. See doc/agent-org-lab.md §4.
#
# ── What is instrumented ────────────────────────────────────────────────────
#
# cAdvisor was here and is gone. On Docker Desktop it cannot traverse the VM's
# cgroup filesystem: it reports the root cgroup and nothing else. Six
# configurations were tested — host cgroup namespace, the docker socket, disabling
# the disk metrics whose overlayfs/overlay2 path lookup fails — and the best of
# them produced parent cgroups only, never a container. A privileged container
# mounting the whole host read-only to return one useless series is a bad trade.
#
# THERE ARE NO EXPORTER CONTAINERS. That is deliberate, and it has a cost worth
# stating: `docker compose ps` shows four containers and tells you nothing about
# what is being watched. The answer lives in config/monitoring/alloy/config.alloy,
# and this is what it collects:
#
#   logs      every allowlisted container, off the Docker socket   -> loki
#   metrics   mysqld_exporter, in-process, x2 (prestashopdb, matomodb)
#             camel      scraped at camel:8080/observe/metrics
#             uptime     blackbox_exporter, in-process, 6 probes
#                        (see config/monitoring/blackbox/blackbox.yml)
#                                                                  -> prometheus
#
# nginx-exporter was here too and is gone: open-source stub_status offers
# connection counts and one request counter — no status codes, no latency, no
# per-host — while the gateway's JSON access log in Loki gives all three. Its only
# unique signals were live concurrency and dropped connections, and at this lab's
# request rate neither will ever say anything.
#
# ── Named volumes, which also solved an ownership problem ───────────────────
#
# Loki, Prometheus and Grafana each start as a fixed non-root uid (10001, 65534,
# 472) and — unlike the database images here — never chown their data directory.
# On a bind mount that meant a root-created directory they could not write, so an
# init container had to chown all three before they started.
#
# A named volume is seeded from the image, ownership included, so that whole
# problem and the container that fixed it are gone.
#
# No top-level `networks:` — the docker-compose.yaml entrypoint owns and creates
# the shared network; these services attach to it via the include.
services:

  # The log store. Single tenant: since nothing out-of-universe is ever ingested,
  # there is no X-Scope-OrgID to set in Alloy, in Grafana, or in the agent's tool.
  loki:
    container_name: loki
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./config/monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    networks:
      - archipellabs_default_net

  # The collector. Reads container logs off the Docker socket and forwards the
  # allowlisted ones to Loki. Socket is mounted READ-ONLY: it only ever needs to
  # list containers and follow their logs.
  alloy:
    container_name: alloy
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./config/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./config/monitoring/blackbox/blackbox.yml:/etc/alloy/blackbox.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Where Alloy remembers how far it has read each container's log. Without
      # it, every restart replays the whole log from the beginning and Loki
      # rejects the old entries — "entry too far behind" — filling the collector's
      # own output with errors while silently dropping history.
      - alloy:/var/lib/alloy/data
    # Alloy runs mysqld_exporter in-process for both databases, so it needs their
    # credentials. The committed demo root passwords, same values as
    # config/{prestashop,matomo}/default.env — named distinctly here because both
    # of those files call it MYSQL_ROOT_PASSWORD and env_file would collide.
    environment:
      PRESTASHOPDB_PASSWORD: admin
      MATOMODB_PASSWORD: matomo_root
    depends_on:
      - loki
    networks:
      - archipellabs_default_net

  # Metrics. Retention is short by design — this exists to show a healthy present
  # next to falling revenue, not to hold history.
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --log.level=warn
      # So a scrape-config edit takes effect with
      #   curl -X POST http://prometheus:9090/-/reload
      # instead of a restart, which would discard the head block.
      - --web.enable-lifecycle
      # Alloy is the collector; Prometheus is storage. Without this the
      # remote-write endpoint returns 404 and metrics vanish silently.
      - --web.enable-remote-write-receiver
    volumes:
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks:
      - archipellabs_default_net

  # The dashboards. Datasources and dashboards are provisioned from files under
  # config/monitoring/grafana — reviewed in a pull request and mounted read-only.
  # The container runs the config; it does not own it.
  #
  # Grafana is the HUMAN's window. The agent never opens it — it queries Loki and
  # Prometheus through typed tools (§8), which is also why Grafana's per-datasource
  # permissions being Enterprise-only does not matter here.
  grafana:
    container_name: grafana
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    env_file:
      - ./config/monitoring/default.env
      - path: ./config/monitoring/.env
        required: false
    volumes:
      - ./config/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Separate from provisioning/: Grafana treats every file under a provider's
      # `path` as a dashboard, so the provider yaml cannot live beside the JSON.
      - ./config/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    networks:
      - archipellabs_default_net

# Named volumes, not bind mounts. The application directories are hundreds of
# megabytes of vendor code written once by the image and never edited by hand;
# through a macOS bind mount that copy took FOUR MINUTES on every cold start,
# against a 51-second install. Config and master data stay bind-mounted above,
# because those are the files you actually open.
#
# `name:` is set explicitly so the volume is called exactly this and not
# <project>_<key> — one prefix for the whole stack means `docker volume ls
# --filter name=archipellabs_default_` finds all of them and nothing else.
volumes:
  alloy:
    name: archipellabs_default_alloy
  loki:
    name: archipellabs_default_loki
  prometheus:
    name: archipellabs_default_prometheus
  grafana:
    name: archipellabs_default_grafana

# The employees — two of them, on one image.
#
#     docker compose -f docker-compose-agents.yaml up -d
#
# **Run separately, on purpose.** These cost money: each one holds a provider
# key and answers tickets from the portal's ask page. The company's own stack —
# the shop, the analytics, the integration — must stand on its own without them,
# and it does; an employee that is not running simply cannot be asked.
#
# Two, not seven, because two is what the comparison needs: angel drives typed
# tools through pydantic-ai, philip drives a CLI over a desk. They are the two
# lineages. The other five are the same image with a different `AGENT_NAME`.
#
# The network is created by `docker-compose.yaml`, so bring the company up first.

name: archipellabs-default

networks:
  archipellabs_default_net:
    external: true

x-agent: &agent
  build:
    context: ../../agents
    dockerfile: Dockerfile
  image: archipellabs-agent:latest
  restart: unless-stopped
  # `init: true` because the desk drivers reap their own children: codex is
  # spawned with `start_new_session=True` and killed with `os.killpg`, which
  # leaves orphans for PID 1 to collect. Without an init the container
  # accumulates zombies across runs — the same reason the simulator sets it.
  init: true
  env_file:
    - ./config/agents/default.env
    - path: ./config/agents/.env
      required: false
  networks:
    - archipellabs_default_net

services:
  # Typed tools, pydantic-ai. Cheap and fast — ~$0.015 and 45s per
  # investigation — because a typed call returns a value where a shell returns a
  # conversation to re-read.
  agent-angel:
    <<: *agent
    container_name: agent-angel
    environment:
      AGENT_NAME: angel
    volumes:
      - agent_angel_runs:/var/lib/agent/runs

  # A desk and a real shell, driven through codex. Slower and dearer — ~$0.05
  # and 200s — and the only one of the two whose brief you can edit and diff.
  agent-philip:
    <<: *agent
    container_name: agent-philip
    environment:
      AGENT_NAME: philip
    volumes:
      - agent_philip_runs:/var/lib/agent/runs

# One volume each. The records are the graded artefact of an investigation and
# must outlive the container; sharing one volume between two employees would
# put their evidence in the same directory, which is how a run of blair's was
# once found in mock's.
volumes:
  agent_angel_runs:
    name: archipellabs_default_agent_angel_runs
  agent_philip_runs:
    name: archipellabs_default_agent_philip_runs

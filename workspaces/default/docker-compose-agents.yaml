# The employees — all seven, in one container.
#
#     docker compose -f docker-compose-agents.yaml up -d
#
# **Run separately, on purpose.** These cost money: the container holds a
# provider key and answers tickets from the portal's ask page. The company's own
# stack — the shop, the analytics, the integration — must stand on its own
# without them, and it does; an employee that is not being served simply cannot
# be asked.
#
# The network is created by `docker-compose.yaml`, so bring the company up first.

name: archipellabs-default

networks:
  archipellabs_default_net:
    external: true

services:
  # One process serving all seven. `AGENT_NAME` takes a name, a comma-separated
  # list, or `*`; the list is spelled out rather than starred so that adding an
  # employee to `roles/` is a decision made here rather than a side effect of
  # creating a directory.
  #
  # **Nothing about an employee changes in this arrangement.** Each keeps its own
  # `max_slots=1`, so one investigation at a time per name, and its own named
  # configuration, so `PHILIP_HARNESS` still reaches only philip. The bus routes
  # on `<agent>.investigate` exactly as before — a caller cannot tell whether it
  # reached one container or seven.
  #
  # What it does change is the blast radius: a crash takes all seven down
  # together. Split this into one service per employee — same image, same file,
  # a different `AGENT_NAME` each — the day that matters more than the ~600MB
  # and the single thing to restart.
  agents:
    build:
      context: ../../agents
      dockerfile: Dockerfile
    image: archipellabs-agent:latest
    container_name: agents
    restart: unless-stopped
    # `init: true` because the desk drivers reap their own children: codex is
    # spawned with `start_new_session=True` and killed with `os.killpg`, which
    # leaves orphans for PID 1 to collect. With seven employees in one container
    # that is no longer a nicety — four of them spawn subprocesses.
    init: true
    environment:
      AGENT_NAME: angel,blair,charlie,dana,ethan,mock,philip
    env_file:
      - ./config/agents/default.env
      - path: ./config/agents/.env
        required: false
    volumes:
      # One mount for everything an investigation writes: its record, its
      # scratch, its datasets and the logs it pulled down. The Dockerfile points
      # all four at this path precisely so a rebuilt container does not lose
      # them — and so none of it lands back in `roles/`.
      - agent_runs:/var/lib/agent
    networks:
      - archipellabs_default_net

# One volume, because there is one container. The records do not collide: a run
# id is `<agent>_<hex12>`, so whose investigation a file belongs to is readable
# from its name rather than from the directory it sits in — which is what made
# a run of blair's, found once in mock's directory, a confusing thing to explain.
volumes:
  agent_runs:
    name: archipellabs_default_agent_runs

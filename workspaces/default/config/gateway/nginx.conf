# /etc/nginx/conf.d/default.conf
# Full config: HTTP -> HTTPS redirect + HTTPS reverse proxy to PrestaShop
# Includes extra headers so PrestaShop/Symfony reliably detects HTTPS behind the proxy.

# The edge log is kept, on purpose. It is the only place that sees every request
# with its true client IP, its total latency and its status BEFORE the
# application filters anything — and it keeps logging when the service behind it
# is broken, which is exactly when it matters. Switching it off to quieten a
# terminal trades permanent evidence for temporary comfort.
#
# JSON, so Loki parses it into fields: `{service="gateway"} | json | status >= 500`
# rather than a regex against a text line. `sim` tags synthetic traffic — the
# simulator sends X-Archipel-Simulator, so real and generated traffic stay
# separable.
log_format archipel escape=json
  '{'
  '"time":"$time_iso8601",'
  '"client":"$remote_addr",'
  '"xff":"$http_x_forwarded_for",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"duration":$request_time,'
  '"upstream":"$upstream_addr",'
  '"upstream_time":"$upstream_response_time",'
  '"referer":"$http_referer",'
  '"ua":"$http_user_agent",'
  '"sim":"$http_x_archipel_simulator"'
  '}';

# Volume without information: a page load drags in dozens of css/js/img requests
# that say nothing about what a customer did. Filtering those — rather than
# turning the log off — is what keeps it both quiet and useful.
map $uri $loggable {
  default                                                            1;
  "~*\.(css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|map)$"  0;
}

# ── One vhost per service, each at / ────────────────────────────────────────
#
# Every application is served at the ROOT of its own name, which is the layout
# every one of them supports out of the box. The alternative — one host with
# /stats/, /portal/, /grafana/ — was tried and does not survive contact: Grafana
# needs root_url + serve_from_sub_path and still breaks, the portal was already
# pushed onto its own port for the same reason, and PrestaShop builds absolute
# URLs from ps_shop_url. Subdomains DELETE that configuration rather than adding
# to it.
#
# The names resolve in both worlds: /etc/hosts points them at 127.0.0.1 for the
# host, and the gateway carries them as Docker network aliases so containers
# reach them too. That symmetry is what lets the simulator drive Chromium from
# inside Docker against the same URL a human uses — and it is why the shop stops
# answering 302 to a mismatched Host.

# Shared proxy behaviour. `resolver` matters: nginx caches an upstream's IP at
# config load, so a recreated container 502s until a reload. 127.0.0.11 is
# Docker's embedded DNS, and using a variable in proxy_pass forces a lookup per
# request.
resolver 127.0.0.11 valid=10s ipv6=off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Everything on http, to https, keeping the hostname.
server {
  listen 80 default_server;
  server_name _;

  return 301 https://$host$request_uri;
}

# Anything whose Host matches no vhost below. It must FAIL, not fall through:
# when this redirected to the portal, a stale `https://localhost` in a test
# quietly loaded the portal in Chromium instead of the shop, and the failure
# surfaced as "the storefront has no categories" — nowhere near the cause.
# 421 says exactly what happened: wrong host for this server.
server {
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate     /etc/nginx/certs/gateway.crt;
  ssl_certificate_key /etc/nginx/certs/gateway.key;

  return 421;
}

# The apex — a front door, pointing at the lab's own portal (the simulator's
# frontend). The shop lives on shop.* and is never served from here.
server {
  listen 443 ssl;
  server_name archipellabs.test;

  ssl_certificate     /etc/nginx/certs/gateway.crt;
  ssl_certificate_key /etc/nginx/certs/gateway.key;

  return 301 https://portal.archipellabs.test$request_uri;
}

# The storefront, and with it /admin-dev, /api and /admin-api.
server {
  listen 443 ssl;
  server_name shop.archipellabs.test;

  access_log /var/log/nginx/access.log archipel if=$loggable;

  ssl_certificate     /etc/nginx/certs/gateway.crt;
  ssl_certificate_key /etc/nginx/certs/gateway.key;

  # Modules and images.
  client_max_body_size 50m;

  proxy_connect_timeout 30s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  location / {
    set $upstream http://prestashop;
    proxy_pass $upstream;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Without these PrestaShop builds http:// URLs behind the TLS terminator.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header HTTPS             on;

    proxy_set_header Connection        "";
  }
}

# Matomo. On its own name it serves at the root, so the prefix-stripping
# proxy_pass that /stats/ needed is simply gone.
server {
  listen 443 ssl;
  server_name tracking.archipellabs.test;

  access_log /var/log/nginx/access.log archipel if=$loggable;

  ssl_certificate     /etc/nginx/certs/gateway.crt;
  ssl_certificate_key /etc/nginx/certs/gateway.key;

  client_max_body_size 50m;

  location / {
    set $upstream http://matomo:80;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
  }
}

# The lab's portal (React SPA + FastAPI at the root). Was on :8443.
server {
  listen 443 ssl;
  server_name portal.archipellabs.test;

  access_log /var/log/nginx/access.log archipel if=$loggable;

  ssl_certificate     /etc/nginx/certs/gateway.crt;
  ssl_certificate_key /etc/nginx/certs/gateway.key;

  client_max_body_size 50m;

  location / {
    set $upstream http://portal:8000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
  }
}

# Grafana. Was on :3000 precisely because a sub-path did not work; on its own
# name it needs no root_url gymnastics at all.
server {
  listen 443 ssl;
  server_name grafana.archipellabs.test;

  access_log /var/log/nginx/access.log archipel if=$loggable;

  ssl_certificate     /etc/nginx/certs/gateway.crt;
  ssl_certificate_key /etc/nginx/certs/gateway.key;

  location / {
    set $upstream http://grafana:3000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # Live tailing in Explore is a websocket.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }
}

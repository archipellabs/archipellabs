# /etc/nginx/conf.d/default.conf
# Full config: HTTP -> HTTPS redirect + HTTPS reverse proxy to PrestaShop
# Includes extra headers so PrestaShop/Symfony reliably detects HTTPS behind the proxy.

# The edge log is kept, on purpose. It is the only place that sees every request
# with its true client IP, its total latency and its status BEFORE the
# application filters anything — and it keeps logging when the service behind it
# is broken, which is exactly when it matters. Switching it off to quieten a
# terminal trades permanent evidence for temporary comfort.
#
# JSON, so Loki parses it into fields: `{service="gateway"} | json | status >= 500`
# rather than a regex against a text line. `sim` tags synthetic traffic — the
# simulator sends X-Archipel-Simulator, so real and generated traffic stay
# separable.
log_format archipel escape=json
  '{'
  '"time":"$time_iso8601",'
  '"client":"$remote_addr",'
  '"xff":"$http_x_forwarded_for",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"duration":$request_time,'
  '"upstream":"$upstream_addr",'
  '"upstream_time":"$upstream_response_time",'
  '"referer":"$http_referer",'
  '"ua":"$http_user_agent",'
  '"sim":"$http_x_archipel_simulator"'
  '}';

# Volume without information: a page load drags in dozens of css/js/img requests
# that say nothing about what a customer did. Filtering those — rather than
# turning the log off — is what keeps it both quiet and useful.
map $uri $loggable {
  default                                                            1;
  "~*\.(css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|map)$"  0;
}

# Redirect all HTTP traffic to HTTPS
server {
  listen 80;
  server_name localhost;

  return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
  listen 443 ssl;
  server_name localhost;

  access_log /var/log/nginx/access.log archipel if=$loggable;

  # Self-signed (dev) cert paths inside the nginx container
  ssl_certificate     /etc/nginx/certs/localhost.crt;
  ssl_certificate_key /etc/nginx/certs/localhost.key;

  # Reasonable TLS defaults for local/dev
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Allow bigger uploads (modules/images)
  client_max_body_size 50m;

  # Optional: tighter timeouts (tune as needed)
  proxy_connect_timeout 30s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Matomo analytics on the same origin so the tracker (matomo.js / matomo.php)
  # loads without mixed-content. The trailing slash strips the /stats/ prefix, so
  # Matomo serves its endpoints at the paths the tracker requests.
  location /stats/ {
    proxy_pass http://matomo:80/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
  }

  # Proxy everything else (covers /admin-api too)
  location / {
    proxy_pass http://prestashop;
    proxy_http_version 1.1;

    # Preserve host + client info
    proxy_set_header Host                 $host;
    proxy_set_header X-Real-IP            $remote_addr;
    proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;

    # Critical: make upstream detect HTTPS properly
    proxy_set_header X-Forwarded-Proto    https;
    proxy_set_header X-Forwarded-Port     443;
    proxy_set_header X-Forwarded-Host     $host;

    # Legacy hint (some stacks still read this)
    proxy_set_header HTTPS                on;

    # If upstream uses keep-alive / websockets (usually not needed here, but harmless)
    proxy_set_header Connection           "";
  }
}

# TimberWorks simulator portal (React SPA + FastAPI) on its own TLS port. In
# production this becomes a subdomain; here a separate port keeps the portal free of
# any sub-path — the backend serves the SPA + /api at the root. → https://localhost:8443
server {
  listen 8443 ssl;
  server_name localhost;

  access_log /var/log/nginx/access.log archipel if=$loggable;

  ssl_certificate     /etc/nginx/certs/localhost.crt;
  ssl_certificate_key /etc/nginx/certs/localhost.key;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 50m;

  location / {
    proxy_pass http://portal:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
  }
}

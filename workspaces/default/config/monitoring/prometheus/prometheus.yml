# Prometheus — storage, and nothing else.
#
# THERE ARE NO scrape_configs, and that is the point. Alloy is the only collector
# in this stack: it runs the exporters in-process, scrapes Camel and the uptime
# probes, and remote-writes everything here (which is what
# --web.enable-remote-write-receiver on the container is for).
#
# It used to scrape itself at localhost:9090 — correct, since inside this
# container localhost IS Prometheus, but redundant once Alloy started scraping
# prometheus:9090 as well. The same metrics arrived twice under two job labels,
# which is the sort of thing that quietly doubles a "targets up" count and makes a
# dashboard lie about its own scale.
#
# Add a target to config/monitoring/alloy/config.alloy, never here.
global:
  scrape_interval: 15s

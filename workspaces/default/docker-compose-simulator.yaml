# Simulator stack.
#
# Holds the simulator's own datastore — the activity database (PostgreSQL) that
# records each customer-journey run — and the PORTAL that visualises it (analytics
# + cartography). Both run in Docker and are brought up by the entrypoint (see the
# `include:` in docker-compose.yaml); the gateway routes /portal/ to the portal.
#
# All three run in Docker: the activity database, the portal that visualises it,
# and the simulator itself. The simulator ran on the host until the stack got
# real hostnames — see the service's own comment for why that was the blocker.

# No top-level `networks:` here — the docker-compose.yaml entrypoint owns and
# creates the shared network, and these services attach to it via the include.
# (This stack is not meant to run standalone; use the entrypoint.)
services:

  # The simulator's activity database: records each customer-journey run so the
  # coming charts app can query it. Unlike the in-network MySQL/MariaDB, it
  # PUBLISHES 5432 because the simulator app runs locally (on the host) for now and
  # reaches Postgres over localhost.
  simulatordb:
    container_name: simulatordb
    image: postgres:16-alpine
    restart: unless-stopped
    # DB config lives in its own env_file (shared with the portal); the Postgres
    # image reads the POSTGRES_* keys from it.
    env_file:
      - ./config/simulator/db.env
    ports:
      - "5432:5432"
    volumes:
      - simulatordb:/var/lib/postgresql/data
    networks:
      - archipellabs_default_net

  # The simulator's frontend: analytics + cartography over the activity DB. One
  # image (portal/Dockerfile) where FastAPI serves both its API and the built React
  # SPA at the root, so the gateway proxies it with no context path at
  # https://portal.archipellabs.test (config/gateway/nginx.conf).
  portal:
    container_name: portal
    build:
      context: ../../portal
      dockerfile: Dockerfile
    image: archipellabs-portal:latest
    restart: unless-stopped
    depends_on:
      - simulatordb
    # Loads only db.env (shared with simulatordb) — the activity DB is all the portal
    # touches, so it never sees the simulator's PrestaShop/Redis secrets in
    # default.env. Served at the root of https://portal.archipellabs.test, so
    # there is no context path to configure.
    # db.env for the activity database, default.env for REDIS_URL. The second is
    # new and reverses what the note above used to say: the portal now reaches
    # the agent bus, because the ask page exists to put a question to an employee
    # and the employees live on it. Stated rather than quietly widened.
    env_file:
      - ./config/simulator/db.env
      - ./config/simulator/default.env
    networks:
      - archipellabs_default_net

  # The simulator itself. It drives real Chromium sessions against the storefront
  # — browsing, adding to cart, checking out — and that traffic is what makes the
  # shop a company rather than a demo.
  #
  # This ran on the host until the stack got real hostnames. The blocker was
  # never Docker: the shop's canonical domain was `localhost`, which inside a
  # container means the container itself, so Chromium could not reach the
  # storefront and PrestaShop answered 302 to any other Host. Now that the
  # gateway carries `shop.archipellabs.test` as a network alias, the container
  # and a human browser use the SAME url, and the redirect problem is gone
  # rather than worked around.
  simulator:
    container_name: simulator
    build:
      context: ../../simulator
      dockerfile: Dockerfile
    image: archipellabs-simulator:latest
    restart: unless-stopped
    init: true # reap Chromium child processes
    shm_size: 1gb # Chromium needs more than Docker's default 64MB /dev/shm
    depends_on:
      simulatordb:
        condition: service_started
      redis:
        condition: service_started
      # Nothing to browse until the shop exists: the storefront is provisioned
      # here, and the catalogue is seeded by this service once it starts.
      prestashop-sidecar:
        condition: service_completed_successfully
    # Committed demo values in db.env + default.env; copy to .env in the same
    # folder for local overrides (gitignored, optional).
    env_file:
      - ./config/simulator/db.env
      - ./config/simulator/default.env
      - path: ./config/simulator/.env
        required: false
    networks:
      - archipellabs_default_net

# Named volumes, not bind mounts. The application directories are hundreds of
# megabytes of vendor code written once by the image and never edited by hand;
# through a macOS bind mount that copy took FOUR MINUTES on every cold start,
# against a 51-second install. Config and master data stay bind-mounted above,
# because those are the files you actually open.
#
# `name:` is set explicitly so the volume is called exactly this and not
# <project>_<key> — one prefix for the whole stack means `docker volume ls
# --filter name=archipellabs_default_` finds all of them and nothing else.
volumes:
  simulatordb:
    name: archipellabs_default_simulatordb

name: archipellabs-default

networks:
  # This entrypoint OWNS the shared network: `docker compose up` creates it with a
  # pinned subnet (matching PrestaShop's PS_TRUSTED_PROXIES) — no manual
  # `docker network create` needed. The included stacks (ecommerce, tracking) do
  # NOT redeclare it (an included `external: true` would win the include merge and
  # stop the entrypoint from creating it); their services just attach. The
  # simulator, run separately, references it as `external` — so bring the
  # storefront up first.
  archipellabs_default_net:
    name: archipellabs_default_net
    ipam:
      config:
        - subnet: 172.31.0.0/24

include:
  - path: docker-compose-ecommerce.yaml
  - path: docker-compose-tracking.yaml
  # The simulator stack — brings up only the activity database (simulatordb); the
  # simulator app itself is deferred and run locally (see the file's header).
  - path: docker-compose-simulator.yaml
  # The integration layer (Apache Camel) — carries master data between systems.
  - path: docker-compose-integration.yaml
  # The ERP — system of record for master data. Currently a file drop on SFTP;
  # the name is the role, not the implementation (cf. `tracking` = Matomo).
  - path: docker-compose-erp.yaml
  # Monitoring — logs and metrics for the COMPANY's systems only. Deliberately
  # blind to the simulator, which is the instrument rather than part of the
  # company (see the file's header).
  - path: docker-compose-monitoring.yaml

services:
  # Shared reverse-proxy / TLS gateway. It fronts BOTH included stacks — the
  # storefront (/) and Matomo (/stats/) — so it lives on the entrypoint rather
  # than inside either sub-stack.
  gateway:
    container_name: gateway
    image: nginx:1.25-alpine
    # Just 80 and 443 now: every service has its own hostname instead of its own
    # port, so the portal's 8443 and Grafana's 3000 are gone.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/gateway/certs:/etc/nginx/certs:ro
    depends_on:
      - prestashop
      - matomo
      - portal
    # THE ALIASES ARE THE POINT. /etc/hosts makes these names resolve to 127.0.0.1
    # for the host; these make the SAME names resolve to this container from
    # inside the network. One URL that works everywhere — which is what lets the
    # simulator drive Chromium from a container against the address a human uses,
    # with a Host header the shop accepts instead of redirecting.
    networks:
      archipellabs_default_net:
        aliases:
          - archipellabs.test
          - shop.archipellabs.test
          - tracking.archipellabs.test
          - portal.archipellabs.test
          - grafana.archipellabs.test
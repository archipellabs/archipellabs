# Shared endpoint configuration, so a shop call is one line instead of six.
#
# Loaded automatically: Camel JBang picks up application.properties from
# --source-dir, and env placeholders inside these values resolve normally.
#
# The routes call the shop as `to: "{{shop.api}}/x?httpMethod=GET&{{shop.auth}}"`
# — everything in the URI, no `parameters:` block. That is not a style choice:
# the YAML DSL rejects a `uri:` containing a query string whenever a
# `parameters:` block sits beside it ("Uri should not contains query
# parameters"), so the two forms cannot be mixed. All-in-the-URI is the one that
# lets shared options live here instead of being retyped at every call.
#
# shop.auth carries the two things every Webservice call needs, neither obvious:
#   customHostHeader — PrestaShop 302s any request whose Host is not its
#                      canonical domain, and setHeader:Host does not work because
#                      the HTTP producer overwrites it from the URI.
#   authPassword=    — deliberately empty: the Webservice key goes in the
#                      username and the password is blank.
shop.api = http://{{env:SHOP_INTERNAL_HOST}}/api
shop.auth = customHostHeader={{env:PS_DOMAIN}}&authMethod=Basic&authUsername={{env:WEBSERVICE_API_KEY}}&authPassword=

feeds.uri = sftp://{{env:FEEDS_USER}}@{{env:FEEDS_HOST}}/data

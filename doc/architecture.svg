<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" role="img" aria-label="TimberWorks architecture. On the left, out of universe, the instrument: a local Python simulator driving customer traffic and catalog reconciliation over Redis Streams, a Postgres activity database recording every journey, and the portal that reads it. In the centre, an nginx TLS gateway. On the right, inside a dashed boundary, the company: an ERP file drop served over SFTP whose CSV master data Apache Camel carries into the PrestaShop storefront through its Webservice API; PrestaShop backed by MySQL, Matomo backed by MariaDB, and a run-once provisioning sidecar beside each; the storefront reports page views to Matomo. Along the bottom, the observability stack — Alloy collecting into Loki and Prometheus, read by Grafana — which watches company systems only and never the simulator. A roadmap line lists the capabilities still to come.">
